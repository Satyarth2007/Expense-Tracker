<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2c2820"/>
      <stop offset="100%" stop-color="#1a1712"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#C79A56" stroke-width="3"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#A9793A" stroke-width="1" opacity="0.5"/>

  <!-- Monogram E -->
  <g fill="#C79A56">
    <rect x="45" y="35" width="10" height="58" rx="2"/>
    <rect x="45" y="35" width="35" height="10" rx="2"/>
    <rect x="45" y="59" width="27" height="9" rx="2"/>
    <rect x="45" y="83" width="35" height="10" rx="2"/>
  </g>

  <!-- Ledger tick, small flourish under the monogram -->
  <line x1="46" y1="102" x2="82" y2="102" stroke="#A9793A" stroke-width="1.5" opacity="0.6"/>
</svg>
